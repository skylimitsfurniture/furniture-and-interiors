<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/">
  <title>Sky Limits Furniture - Loading...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #FBFAF7;
      color: #1E2A32;
    }
    .card {
      background: white;
      padding: 32px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      border: 1px solid #EDE8DE;
      max-width: 460px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #EDE8DE;
      border-top-color: #8B5E3C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 10px; font-size: 22px; color: #1E2A32; }
    p { margin: 0 0 20px; color: #555; font-size: 14px; line-height: 1.5; }
    a.btn {
      display: inline-block;
      background: #8B5E3C;
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(139,94,60,0.3);
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #5E3E27;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Opening Sky Limits Furniture</h2>
    <p>Redirecting you to the active application running with live video & interactive features...</p>
    <a href="http://localhost:3000/" class="btn">Click Here to Open Website (Port 3000)</a>
  </div>
  <script>
    window.location.href = "http://localhost:3000/";
  </script>
</body>
</html>
